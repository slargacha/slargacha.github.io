<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}"{% if page.lang %} data-page-lang="{{ page.lang }}"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var __l=localStorage.getItem('lang');if(__l&&!document.documentElement.getAttribute('data-page-lang'))document.documentElement.lang=__l;}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#050a18">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"></noscript>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "{{ site.url }}/#person",
    "name": "{{ site.author.name }}",
    "jobTitle": "{{ site.author.role }}",
    "url": "{{ site.url }}",
    "image": "{{ '/assets/og-image.png' | absolute_url }}",
    "sameAs": [
      "https://github.com/{{ site.author.github }}",
      "https://www.linkedin.com/in/{{ site.author.linkedin }}/"
    ],
    "knowsAbout": ["AWS", "Kubernetes", "Terraform", "Docker", "Azure DevOps", "CI/CD", "Cloud Infrastructure"]
  }
  </script>
</head>
<body>

<div class="bg-gradient"></div>
<div class="noise"></div>

{% include nav.html %}

<main id="main">
{{ content }}
</main>

{% include footer.html %}

<script src="{{ '/assets/js/i18n.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
<noscript><style>.reveal{opacity:1;transform:none}</style></noscript>

</body>
</html>
