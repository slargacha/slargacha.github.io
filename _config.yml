title: Sebastian Largacha
description: "Sebastian Largacha — Systems Engineer specializing in cloud infrastructure, Kubernetes, and AWS."
url: "https://slargacha.github.io"
baseurl: ""
lang: en

# Author
author:
  name: Sebastian Largacha
  twitter: slargacha
  role: Systems Engineer
  email: chitas1004@hotmail.com
  github: slargacha
  linkedin: "slargacha"

# SEO / Social
logo: /assets/og-image.png
twitter:
  username: slargacha
  card: summary_large_image

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-image.png
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - .github/
